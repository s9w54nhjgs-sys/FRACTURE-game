<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>FRACTURE — Prototype 01</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090e17;color:#e5f5f6;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:env(safe-area-inset-top);left:0;right:0;padding:16px;display:flex;justify-content:space-between;gap:12px;text-shadow:0 2px 8px #000}#brand{font-weight:800;letter-spacing:.15em;font-size:14px}#stats{font-size:12px;text-align:right;line-height:1.7}#notice{position:absolute;top:23%;width:100%;text-align:center;font-weight:700;text-shadow:0 2px 10px #000;opacity:0;transition:opacity .2s}#notice.show{opacity:1}#joy{position:absolute;left:22px;bottom:calc(35px + env(safe-area-inset-bottom));width:132px;height:132px;border:2px solid #7ce7db66;border-radius:50%;background:#a6fdf512;pointer-events:auto;touch-action:none}#knob{position:absolute;left:43px;top:43px;width:42px;height:42px;border-radius:50%;background:#8ce8e3a8;box-shadow:0 0 18px #6dd8dd88}#buttons{position:absolute;right:18px;bottom:calc(32px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:end;pointer-events:auto}.btn{width:67px;height:67px;border:1px solid #b5f7e588;border-radius:50%;background:#0b2735b9;color:#d9fffc;font-weight:700;touch-action:none}.btn:active{background:#399f9eaa}#dash{width:58px;height:58px}#hint{position:absolute;bottom:calc(190px + env(safe-area-inset-bottom));right:16px;text-align:right;font-size:11px;color:#bcd5dc;max-width:180px}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#090e17;z-index:5;text-align:center;padding:30px}#loading.hidden{display:none}#result{position:fixed;inset:0;background:#07111cdd;z-index:6;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}#result.show{display:flex}#resultPanel{background:#122634;border:1px solid #7ce7db66;border-radius:20px;padding:30px 24px;width:min(360px,100%)}#restart{margin-top:18px;padding:14px 30px;background:#7ce7db;color:#09212a;border:0;border-radius:12px;font-size:16px;font-weight:800}#reticle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:.5}#extract{position:absolute;bottom:calc(175px + env(safe-area-inset-bottom));left:16px;font-size:12px;color:#baf9e9}
</style></head><body>
<div id="loading">FRACTURE<br>PROTOCOL INITIALIZING…<br><small>初回起動にはインターネット接続が必要です</small></div>
<div id="result"><div id="resultPanel"><h1 id="resultTitle">EXTRACTION SUCCESS</h1><p id="resultText"></p><button id="restart" onclick="location.reload()">もう一度出撃</button></div></div><div id="hud"><div id="top"><div id="brand">FRACTURE <small> / PROTOTYPE 01</small></div><div id="stats">HP <span id="hp">100</span>　SHIELD <span id="shield">50</span><br>素材 <span id="loot">0</span>/3　撃破 <span id="kills">0</span></div></div><div id="notice"></div><div id="reticle">＋</div><div id="extract">出口：緑色の光柱を探せ</div><div id="joy"><div id="knob"></div></div><div id="hint">右側をスワイプ：視点<br>左スティック：移動</div><div id="buttons"><button id="dash" class="btn">DASH</button><button id="attack" class="btn">攻撃</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8da9b5);scene.fog=new THREE.FogExp2(0x8da9b5,.017);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,350);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xcfeaff,0x3b414e,2));const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(25,55,30);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,260),new THREE.MeshStandardMaterial({color:0x596d70,roughness:.92}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const grid=new THREE.GridHelper(260,52,0x8bb4b0,0x6b8588);grid.position.y=.015;scene.add(grid);
const walls=[];function block(x,z,w,h,d,color=0x273f4a){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.78,metalness:.22}));m.position.set(x,h/2,z);scene.add(m);walls.push({x,z,w,d});return m}
for(let i=0;i<32;i++){const a=i*2.399,rad=19+Math.sqrt(i)*13,x=Math.cos(a)*rad,z=Math.sin(a)*rad;if(Math.hypot(x,z)<13||Math.hypot(x-38,z+25)<12)continue;block(x,z,4+(i%4)*3,5+(i%5)*5,4+(i%3)*3,i%4===0?0x45616b:0x283d48)}
const pillarMat=new THREE.MeshStandardMaterial({color:0x92e9df,emissive:0x2c9d9b,emissiveIntensity:.5});
const player=new THREE.Group();const shell=new THREE.Mesh(new THREE.OctahedronGeometry(.95,0),new THREE.MeshStandardMaterial({color:0xa4e6e9,metalness:.65,roughness:.25,flatShading:true,emissive:0x184a55,emissiveIntensity:.45}));player.add(shell);const core=new THREE.Mesh(new THREE.OctahedronGeometry(.36),new THREE.MeshBasicMaterial({color:0xe4ffff,wireframe:true}));player.add(core);scene.add(player);player.position.set(0,1.3,0);
const crystals=[];function crystal(x,z){const m=new THREE.Mesh(new THREE.OctahedronGeometry(.55),pillarMat);m.position.set(x,.85,z);scene.add(m);crystals.push(m)}
[[7,-6],[-9,-7],[13,12],[-17,8],[25,-15],[-23,-19],[39,-22]].forEach(p=>crystal(...p));
const exit=new THREE.Group();const beam=new THREE.Mesh(new THREE.CylinderGeometry(2,2,18,24,1,true),new THREE.MeshBasicMaterial({color:0x67f5b6,transparent:true,opacity:.12,side:THREE.DoubleSide,depthWrite:false}));beam.position.y=9;exit.add(beam);const ring=new THREE.Mesh(new THREE.TorusGeometry(2,.12,10,48),new THREE.MeshBasicMaterial({color:0x71ffba}));ring.rotation.x=Math.PI/2;ring.position.y=.1;exit.add(ring);exit.position.set(38,0,-25);scene.add(exit);
const enemies=[];function spawn(x,z){const g=new THREE.Group(),m=new THREE.Mesh(new THREE.IcosahedronGeometry(.9,0),new THREE.MeshStandardMaterial({color:0xf4748b,metalness:.4,roughness:.3,flatShading:true}));g.add(m);g.position.set(x,1.2,z);g.userData={hp:3,hit:0};scene.add(g);enemies.push(g)}spawn(15,-4);spawn(-13,13);spawn(30,-19);
let hp=100,shield=50,loot=0,kills=0,yaw=0,pitch=.28,last=performance.now(),lastHit=0,lastAttack=0,lastDash=0,dashUntil=0,done=false,noticeTimer,hitStopUntil=0;
const $=id=>document.getElementById(id);function notify(t){$('notice').textContent=t;$('notice').classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').classList.remove('show'),2600)}
const input={x:0,y:0};const joy=$('joy'),knob=$('knob');let joyId=null;
function setJoy(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.max(1,Math.hypot(dx,dy)),k=Math.min(1,len/48);input.x=dx/len*k;input.y=dy/len*k;knob.style.transform='translate('+input.x*43+'px,'+input.y*43+'px)'}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);setJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)setJoy(e)});function resetJoy(e){if(e.pointerId!==joyId)return;joyId=null;input.x=input.y=0;knob.style.transform=''}joy.addEventListener('pointerup',resetJoy);joy.addEventListener('pointercancel',resetJoy);
let lookId=null,lookX=0,lookY=0;renderer.domElement.addEventListener('pointerdown',e=>{if(lookId===null){lookId=e.pointerId;lookX=e.clientX;lookY=e.clientY;renderer.domElement.setPointerCapture(lookId)}});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;yaw-=(e.clientX-lookX)*.005;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-lookY)*.003,-.2,.8);lookX=e.clientX;lookY=e.clientY});renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===lookId)lookId=null});renderer.domElement.addEventListener('pointercancel',e=>{if(e.pointerId===lookId)lookId=null});
const keys={};window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')attack()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function finish(success){done=true;$('resultTitle').textContent=success?'EXTRACTION SUCCESS':'MISSION FAILED';$('resultText').textContent=success?'素材 '+loot+' 個回収 / 敵 '+kills+' 体撃破':'生命力が尽きた。もう一度挑戦しよう。';$('result').classList.add('show')}
function attack(){if(done||performance.now()-lastAttack<450)return;lastAttack=performance.now();shell.material.emissive.setHex(0x64ffff);setTimeout(()=>shell.material.emissive.setHex(0x184a55),130);let target=null,dist=5.2;for(const e of enemies){const dx=e.position.x-player.position.x,dz=e.position.z-player.position.z,d=Math.hypot(dx,dz),ang=Math.atan2(-dx,-dz),diff=Math.atan2(Math.sin(ang-yaw),Math.cos(ang-yaw));if(d<dist&&(d<2.3||Math.abs(diff)<1.1)){target=e;dist=d}}if(target){hitStopUntil=performance.now()+80;target.userData.hp--;target.scale.setScalar(1.3);setTimeout(()=>target.scale.setScalar(1),130);if(target.userData.hp<=0){scene.remove(target);enemies.splice(enemies.indexOf(target),1);kills++;$('kills').textContent=kills;notify('HOSTILE ELIMINATED')}}else notify('攻撃：敵が射程外')}
$('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});$('dash').addEventListener('pointerdown',e=>{e.preventDefault();if(performance.now()-lastDash>1200){lastDash=performance.now();dashUntil=lastDash+400}});
function collides(x,z){if(Math.abs(x)>125||Math.abs(z)>125)return true;return walls.some(b=>Math.abs(x-b.x)<b.w/2+1&&Math.abs(z-b.z)<b.d/2+1)}
function update(t){requestAnimationFrame(update);const dt=t<hitStopUntil?0:Math.min((t-last)/1000,.05);last=t;if(!done){let mx=input.x+(keys.d?1:0)-(keys.a?1:0),my=input.y+(keys.s?1:0)-(keys.w?1:0);const mag=Math.hypot(mx,my);if(mag>.05){mx/=Math.max(1,mag);my/=Math.max(1,mag);const speed=t<dashUntil?15:6.2,dx=(Math.cos(yaw)*mx+Math.sin(yaw)*my)*speed*dt,dz=(-Math.sin(yaw)*mx+Math.cos(yaw)*my)*speed*dt;const nx=player.position.x+dx,nz=player.position.z+dz;if(!collides(nx,player.position.z))player.position.x=nx;if(!collides(player.position.x,nz))player.position.z=nz;player.rotation.y=yaw;shell.rotation.y+=dt*1.7}player.position.y=1.35+Math.sin(t*.0025)*.13;core.rotation.y+=dt;for(const c of [...crystals]){c.rotation.y+=dt;c.position.y=.85+Math.sin(t*.002+c.position.x)*.2;if(c.position.distanceTo(player.position)<1.6){scene.remove(c);crystals.splice(crystals.indexOf(c),1);loot++;$('loot').textContent=loot;notify('素材を回収 '+loot+'/3')}}for(const e of enemies){e.rotation.y+=dt*.7;const d=e.position.distanceTo(player.position);if(d<15&&d>2.2){const dx=(player.position.x-e.position.x)/d*dt*2,dz=(player.position.z-e.position.z)/d*dt*2;if(!collides(e.position.x+dx,e.position.z+dz))e.position.x+=dx,e.position.z+=dz}if(d<2.5&&t-e.userData.hit>1300){e.userData.hit=t;let damage=14;if(shield>0){const absorbed=Math.min(shield,damage);shield-=absorbed;damage-=absorbed}hp-=damage;$('hp').textContent=Math.max(0,Math.round(hp));$('shield').textContent=Math.round(shield);if(hp<=0){finish(false)}}}if(t-lastHit>7000&&shield<50){shield=Math.min(50,shield+dt*4);$('shield').textContent=Math.round(shield)}if(Math.hypot(player.position.x-38,player.position.z+25)<2.7){if(loot>=3){finish(true)}else if(t%2200<35)notify('脱出には素材が3個必要')}}const camDist=8,cy=player.position.y+3.2+pitch*5;camera.position.set(player.position.x+Math.sin(yaw)*camDist,cy,player.position.z+Math.cos(yaw)*camDist);camera.lookAt(player.position.x,player.position.y+.5,player.position.z);renderer.render(scene,camera)}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});$('loading').classList.add('hidden');notify('素材を3つ集め、緑の出口へ');requestAnimationFrame(update);
</script></body></html>
