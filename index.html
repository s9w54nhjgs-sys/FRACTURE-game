}));cloudSky.frustumCulled=false;cloudSky.renderOrder=-1000;scene.add(cloudSky);

function noiseTexture(){const c=document.createElement('canvas');c.width=c.height=256;const ctx=c.getContext('2d'),im=ctx.createImageData(256,256);for(let y=0;y<256;y++)for(let x=0;x<256;x++){const i=(y*256+x)*4,grain=Math.random()*32-16,streak=(x%64<2||y%96<2)?-20:0,v=Math.max(25,Math.min(220,137+grain+streak));im.data[i]=v;im.data[i+1]=v+3;im.data[i+2]=v+4;im.data[i+3]=255}ctx.putImageData(im,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t}const concreteTex=noiseTexture(),concreteMat=new THREE.MeshStandardMaterial({color:0x88969b,metalness:.78,roughness:.39}),darkConcrete=new THREE.MeshStandardMaterial({color:0x3c4b52,metalness:.72,roughness:.47});const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,260),new THREE.MeshStandardMaterial({color:0x59676a,map:concreteTex,roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);
